name: CI

on: [push, pull_request]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: | 
          10.0.x

    - name: Build
      run: ./build.sh -AngleSharpVersion 1.11.0

  windows:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # request the OIDC token for NuGet trusted publishing

    steps:
    - uses: actions/checkout@v7
    
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: | 
          10.0.x

    # Exchanges the GitHub OIDC token for a short-lived (1 hour) NuGet API key.
    # Requires a trusted publishing policy on nuget.org for this repository and workflow file.
    - name: NuGet login
      id: nuget_login
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Build
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        if ($env:GITHUB_REF -eq "refs/heads/main") {
          .\build.ps1 -Target Publish -AngleSharpVersion 1.11.0
        } elseif ($env:GITHUB_REF -eq "refs/heads/devel") {
          .\build.ps1 -Target PrePublish -AngleSharpVersion 1.11.0
        } else {
          .\build.ps1 -AngleSharpVersion 1.11.0
        }
